[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citelint"
version = "2.0.0"
description = "Easy, transparent citation linting for LaTeX papers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Haolin" },
]
keywords = ["latex", "bibtex", "citation", "bibliography", "academic", "paper", "verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = ["bibguard>=0.4.0"]

[project.scripts]
citelint = "citelint.cli:main"

[project.urls]
Homepage = "https://github.com/haolin3/citelint"
Repository = "https://github.com/haolin3/citelint"
Issues = "https://github.com/haolin3/citelint/issues"

[tool.hatch.build.targets.wheel]
packages = ["citelint"]
